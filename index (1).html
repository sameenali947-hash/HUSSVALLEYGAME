<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Valley Chase</title>
<style>
html,body{margin:0;height:100%;background:#0b0d14;color:#fff;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-weight:700;overflow:hidden;touch-action:none;text-shadow:2px 2px 0 #000b}
canvas{display:block;image-rendering:pixelated}
#hud,#cd{position:fixed;left:50%;transform:translateX(-50%);background:#000a;border:3px solid #000;padding:6px 14px;text-align:center;display:none;white-space:nowrap}
#hud{top:8px;font-size:clamp(12px,2.4vw,17px)}
#cd{top:46%;font-size:clamp(20px,5vw,38px);background:none;border:0}
#fl{position:fixed;inset:0;background:#e5484d;opacity:0;pointer-events:none;transition:opacity .2s}
#ab{position:fixed;right:18px;bottom:22px;width:104px;height:104px;border:4px solid #000;background:#4f7be0;color:#fff;font:inherit;font-size:13px;display:none;padding:6px}
#ab:disabled{background:#555}
#dh{position:fixed;right:136px;bottom:22px;width:84px;height:84px;border:4px solid #000;background:#d9822b;color:#fff;font:inherit;font-size:13px;display:none}
#cam{position:fixed;top:8px;right:8px;display:none;padding:6px 10px;font-size:12px}
.ov{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:16px;overflow:auto}
#shop{background:linear-gradient(90deg,#0000 0,#000c 50%);align-items:flex-end}
#help{background:#000b;z-index:5}
.ov h1{margin:0;font-size:clamp(28px,6vw,52px);letter-spacing:2px;background:linear-gradient(#fff,#ffd36b);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 3px 0 #0007)}
.panel{background:linear-gradient(160deg,#2f4a8acc,#1a2547d9);backdrop-filter:blur(6px);border:2px solid #ffffff40;border-radius:16px;box-shadow:0 12px 34px #000a;padding:18px;max-width:min(440px,92vw);display:flex;flex-direction:column;gap:10px;align-items:center}
.panel p{margin:0;color:#e9efff;line-height:1.4}
.b{background:linear-gradient(#7d99ff,#4d63d8);color:#fff;font:inherit;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;box-shadow:0 4px 0 #2a3894,0 6px 12px #0006;text-shadow:0 2px 0 #0005;transition:transform .08s}
.b:active{transform:translateY(2px)}
.b:hover{filter:brightness(1.12)}.b.g{background:linear-gradient(#6fdc78,#2f9e44);box-shadow:0 4px 0 #1d6b2e,0 6px 12px #0006}.b.m{background:linear-gradient(#7c8497,#555d70);box-shadow:0 4px 0 #373d4c,0 6px 12px #0006}
.sws{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.sw{width:46px;height:46px;border:3px solid #000;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px}
.sw.on{outline:3px solid #ffeb3b}.sw small{position:absolute;bottom:0;right:0;background:#000b;padding:0 2px}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#000b;border:3px solid #000;padding:8px 16px;display:none;font-size:clamp(14px,3vw,20px);color:#ffe27a}
select{font:inherit;background:#222;color:#fff;border:3px solid #000;padding:6px}
#sb{position:fixed;left:8px;bottom:8px;background:#000a;border:3px solid #000;padding:6px 10px;font-size:12px;display:none;text-align:left;line-height:1.5}
input{font:inherit;background:#222;color:#fff;border:3px solid #000;padding:6px;text-align:center;max-width:150px}
.row{display:flex;align-items:center;gap:10px;background:#0006;padding:8px 10px;width:100%;box-sizing:border-box;text-align:left;justify-content:space-between}.row small{display:block;color:#cbbfa8}
body::after{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,#0000 55%,#0006 100%)}
</style>
</head>
<body>
<div id="hud"></div><div id="cd"></div><div id="fl"></div>
<div id="sb"></div><div id="toast"></div><button id="dh">Dash</button><button id="ab"></button><button id="cam" class="b">View: 3rd person</button>
<div class="ov" id="menu"></div>
<div class="ov" id="shop"></div>
<div class="ov" id="help"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const W=1200,H=800,S=.05; // logic runs in a 1200x800 plane; 1 unit = 20 logic px
let save={diff:'Easy',name:'Player'+(100+Math.floor(Math.random()*900)),coins:100,owned:[],eq:{Runner:'none',Chaser:'none'},av:{skin:0,shirt:0,pants:0,hat:0},avOwned:[],seen:0,spin:0,codes:[],gems:0,mode:'tag',food:true};
try{const s=JSON.parse(localStorage.getItem('valleychase3d'));if(s&&typeof s.coins=='number')save=Object.assign(save,s)}catch(e){}
if(save.ver!=2){save.ver=2;save.diff='Easy'} // older saves start on the easier bots
const persist=()=>{try{localStorage.setItem('valleychase3d',JSON.stringify(save))}catch(e){}};
const $=id=>document.getElementById(id);
const RN={Runner:'Survivor',Chaser:'Imposter'};
const AV={ // [color or label, price]
 skin:[['#f1c27d',0],['#ffdbac',0],['#c68642',0],['#8d5524',0],['#4fae4f',150],['#7fd6ff',0,3]],
 shirt:[['#3b82f6',0],['#e11d48',0],['#f59e0b',0],['#8b5cf6',100],['#14b8a6',100],['#111827',200],['#f472b6',200],['#ffd700',0,5]],
 pants:[['#2b4ea2',0],['#444444',0],['#6b3fa0',50],['#8a5a2b',50],['#0f766e',100],['#ffd700',0,5]],
 hat:[['None',0],['Cap',100],['Crown',400],['Wizard',250],['Hair',50],['Halo',0,8]]
};
function tex(cols,seed){const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d'),r=rng(seed||7);
 for(let i=0;i<16;i++)for(let j=0;j<16;j++){x.fillStyle=cols[Math.floor(r()*cols.length)];x.fillRect(i,j,1,1)}
 const t=new THREE.CanvasTexture(c);t.magFilter=t.minFilter=THREE.NearestFilter;t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}
const ABIL={
 cloak:{n:'Cloak',role:'Runner',price:300,cd:15,dur:3,d:'Nearly invisible for 3s.'},
 shield:{n:'One Hit Shield',role:'Runner',price:450,cd:20,dur:12,d:'Absorbs exactly one tag.'},
 rocket:{n:'Rocket Shoes',role:'Chaser',price:300,cd:12,dur:2,d:'Speed dash for 2s.'},
 dagger:{n:'Big Dagger',role:'Chaser',price:450,cd:14,dur:5,d:'Double tag reach for 5s.'},
 horn:{n:'Air Horn',role:'Runner',price:400,cd:25,dur:0,d:'Blasts nearby Imposters backward and stuns them.'},
 door:{n:'Door Slam',role:'Runner',price:500,cd:22,dur:6,d:'Drops a door behind you for 6s to block Imposters.'},
 decoy:{n:'Inflatable Decoy',role:'Runner',price:500,cd:25,dur:8,d:'A balloon double that Imposters chase.'},
 trap:{n:'Bear Trap',role:'Chaser',price:450,cd:18,dur:20,d:'Freezes a Survivor who steps on it.'}
};

// ---------- three.js setup ----------
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const cv=renderer.domElement,scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,1,.1,300);
scene.background=new THREE.Color(0x0b0d14);
const hemi=new THREE.HemisphereLight(0xdff1ff,0x5b6a4a,.85);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,.85);sun.position.set(48,52,34);sun.target.position.set(30,0,20);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-54,right:54,top:44,bottom:-44,near:1,far:160});sun.shadow.bias=-.0006;scene.add(sun,sun.target);
function skyTex(hex){const c=new THREE.Color(hex),top=c.clone().multiplyScalar(.72),bot=c.clone().lerp(new THREE.Color(0xffffff),.45),cv=document.createElement('canvas');cv.width=2;cv.height=256;
 const x=cv.getContext('2d'),g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,'#'+top.getHexString());g.addColorStop(1,'#'+bot.getHexString());x.fillStyle=g;x.fillRect(0,0,2,256);return new THREE.CanvasTexture(cv)}
function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.fov=cam.aspect<1?75:50;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const mapG=new THREE.Group(),entG=new THREE.Group(),pvG=new THREE.Group(),pvC=new THREE.Group(),foodG=new THREE.Group(),propG=new THREE.Group();scene.add(mapG,entG,pvG,foodG,propG);pvG.add(pvC);pvG.position.set(-100,0,-100);
function dispose(g,geo){g.traverse(o=>{if(geo&&o.geometry)o.geometry.dispose();if(o.material){if(o.material.map)o.material.map.dispose();o.material.dispose()}});while(g.children.length)g.remove(g.children[0])}

// ---------- Maps ----------
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const MAPS=[
 {name:'Candy Kingdom',sky:0xffc8ea,fog:1,pud:0xb5651d,slow:[[200,200,120,120],[800,480,120,120]],fn(r){const w=[];for(let i=0;i<26;i++)w.push([60+r()*1020,60+r()*620,56,56,Math.floor(r()*4)]);return w}},
 {name:'Giant Kitchen',sky:0x2d2018,fog:1,pud:0xc0392b,slow:[[300,330,110,110],[760,90,110,110],[520,560,110,110]],fn(r){const w=[[220,0,40,520,10],[440,280,40,520,10],[660,0,40,520,10],[880,280,40,520,10]];for(let i=0;i<12;i++)w.push([60+r()*1080,40+r()*700,48,48,11+Math.floor(r()*3)]);return w}},
 {name:'Fruit Orchard',sky:0x9fdcff,pud:0x6d4c41,slow:[[260,420,130,110],[820,160,130,110]],fn(r){const w=[];for(let i=0;i<30;i++)w.push([70+r()*1000,70+r()*600,52,52,20+Math.floor(r()*4)]);return w}},
 {name:'Schoolyard',sky:0x8fd0ff,sch:1,pud:0x6d4c41,fn(){return[]}}
];
let map,walls=[],slow=[],neonMat=null;
const box=(w,h,d,mat,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;mapG.add(m);return m};
const MC={},mm=c=>MC[c]||(MC[c]=new THREE.MeshLambertMaterial({color:c}));
// One giant food obstacle (type t) centred on the collision rect w. Collision stays a simple square.
function item(w){
 const cx=(w[0]+w[2]/2)*S,cz=(w[1]+w[3]/2)*S,t=w[4];
 const b=(sw,sh,sd,c,x,y,z)=>box(sw,sh,sd,mm(c),cx+x,y+sh/2,cz+z); // y = bottom of the piece
 if(t==0){b(2.8,1.2,2.8,0xff8fc7,0,0,0);b(2.2,1,2.2,0xfff0f6,0,1.2,0);b(1.6,.9,1.6,0xff6fb0,0,2.2,0);b(.5,.5,.5,0xe11d48,0,3.1,0);
  for(let i=0;i<8;i++)b(.2,.2,.2,[0xffe14d,0x4dd2ff,0x7cff6b][i%3],Math.sin(i*2)*1.1,1.2,Math.cos(i*3)*1.1)}
 else if(t==1){b(.35,2.8,.35,0xffffff,0,0,0);b(2.6,2.6,.4,0xff4d9d,0,2.8,0);b(1.8,1.8,.45,0xffffff,0,3.2,0);b(1,1,.5,0xff4d9d,0,3.6,0)}
 else if(t==2){const c=[0xff5252,0x40c4ff,0xb2ff59,0xffd740][Math.floor(w[0])%4];b(2.8,1.1,2.8,c,0,0,0);b(2.2,.9,2.2,c,0,1.1,0);b(1.5,.8,1.5,c,0,2,0);b(.8,.5,.8,0xffffff,0,2.8,0)}
 else if(t==3){const d=0xc68642,i=0xff69b4;b(2.8,1.1,.9,d,0,0,-.95);b(2.8,1.1,.9,d,0,0,.95);b(.9,1.1,1,d,-.95,0,0);b(.9,1.1,1,d,.95,0,0);
  b(2.9,.25,.95,i,0,1.1,-.95);b(2.9,.25,.95,i,0,1.1,.95);b(.95,.25,1,i,-.95,1.1,0);b(.95,.25,1,i,.95,1.1,0);
  for(let k=0;k<7;k++)b(.18,.18,.18,[0xffffff,0x40c4ff,0xffe14d][k%3],Math.sin(k*2.3)*1.2,1.35,Math.cos(k*1.7)*1.2)}
 else if(t==10){const hz=w[2]>w[3],len=Math.max(w[2],w[3])*S,n=Math.max(1,Math.round(len/2)),sg=len/n;
  for(let i=0;i<n;i++)box(hz?sg:w[2]*S,2.6,hz?w[3]*S:sg,mm(i%2?0x8e98a3:0xa7b0ba),hz?w[0]*S+sg*(i+.5):cx,1.3,hz?cz:w[1]*S+sg*(i+.5));
  box(w[2]*S+.2,.3,w[3]*S+.2,mm(0xb5834a),cx,2.75,cz)}
 else if(t==11){b(2.4,.45,2.4,0xd9a35b,0,0,0);b(2.3,.45,2.3,0xc98f45,.1,.45,0);b(2.4,.45,2.4,0xd9a35b,0,.9,.1);b(1.9,.15,1.9,0xf2b134,0,1.35,0);
  for(let k=0;k<5;k++)b(.4,.1,.4,0xc0392b,Math.sin(k*2)*.6,1.5,Math.cos(k*3)*.6)}
 else if(t==12){b(2.2,.6,2.2,0xd9a05b,0,0,0);b(2.3,.5,2.3,0x5b3a1e,0,.6,0);b(2.4,.12,2.4,0xffd34d,0,1.1,0);b(2.4,.2,2.4,0x4caf50,0,1.22,0);b(2.3,.2,2.3,0xe53935,0,1.42,0);b(2.2,.9,2.2,0xc8883f,0,1.62,0);
  for(let k=0;k<5;k++)b(.2,.1,.2,0xfff3c4,Math.sin(k*2)*.7,2.52,Math.cos(k*3)*.7)}
 else if(t==13){const c=Math.floor(w[0])%2?0xe11d48:0xf4c20d;b(1.6,2.6,1.6,c,0,0,0);b(.8,.7,.8,c,0,2.6,0);b(.5,.4,.5,0xffffff,0,3.3,0)}
 else if(t==20||t==21){const f=t==20?0xe53935:0xff9f1c;b(1,2.2,1,0x7a5230,0,0,0);b(3.2,3.2,3.2,t==20?0x2f8f3a:0x3a9d3f,0,2.2,0);
  for(let k=0;k<7;k++)b(.55,.55,.55,f,Math.sin(k*2)*1.65,2.7+(k%3)*.9,Math.cos(k*2)*1.65)}
 else if(t==22){b(3,1.4,2.4,0x2e7d32,0,0,0);b(2.8,.3,2.2,0xff4d6d,0,1.4,0);for(let k=0;k<6;k++)b(.15,.1,.15,0x111111,Math.sin(k*2)*.9,1.7,Math.cos(k*3)*.7)}
 else{b(2.4,1.8,2.4,0xf57c00,0,0,0);b(.5,.5,2.5,0xd96a00,0,0,0);b(2.5,.5,.5,0xd96a00,0,0,0);b(.3,.6,.3,0x2e7d32,0,1.8,0)}
}
function buildMap(m){
 dispose(mapG,true);for(const k in MC)delete MC[k];neonMat=null;
 scene.background=skyTex(m.sky);scene.fog=m.fog?new THREE.Fog(m.sky,30,95):null;
 const dk=m.name=='Giant Kitchen';hemi.intensity=dk?.6:.85;sun.intensity=dk?.6:.85;sun.color.setHex(dk?0xffd9a0:0xffffff);
 let tx;
 if(m.name=='Fruit Orchard'||m.sch){tx=tex(['#6cc24a','#5fb33e','#68bd45'],3);tx.repeat.set(W*S,H*S)}
 else{const c=document.createElement('canvas');c.width=c.height=2;const x=c.getContext('2d'),cols=m.name=='Candy Kingdom'?['#ffb3d9','#fff0f7']:['#f2f2f2','#34343c'];
  x.fillStyle=cols[0];x.fillRect(0,0,2,2);x.fillStyle=cols[1];x.fillRect(0,0,1,1);x.fillRect(1,1,1,1);
  tx=new THREE.CanvasTexture(c);tx.magFilter=tx.minFilter=THREE.NearestFilter;tx.wrapS=tx.wrapT=THREE.RepeatWrapping;tx.repeat.set(W*S/2,H*S/2)}
 const fl=new THREE.Mesh(new THREE.PlaneGeometry(W*S,H*S),new THREE.MeshLambertMaterial({map:tx}));
 fl.rotation.x=-Math.PI/2;fl.position.set(W*S/2,0,H*S/2);fl.receiveShadow=true;mapG.add(fl);
 const cand=m.name=='Candy Kingdom',orch=m.name=='Fruit Orchard',sch=!!m.sch,rc=cand?0xffffff:orch?0x9c6b3a:sch?0xffffff:0x8e98a3,rh=orch?.4:sch?.3:1.4;
 box(W*S,rh,.6,mm(rc),W*S/2,rh/2,-.3);box(W*S,rh,.6,mm(rc),W*S/2,rh/2,H*S+.3);box(.6,rh,H*S,mm(rc),-.3,rh/2,H*S/2);box(.6,rh,H*S,mm(rc),W*S+.3,rh/2,H*S/2);
 if(cand||orch){for(let i=2;i<W*S;i+=4){const c=cand?(i%8==2?0xe11d48:0xffffff):0x7a5230;box(.5,2.2,.5,mm(c),i,1.1,-.3);box(.5,2.2,.5,mm(c),i,1.1,H*S+.3)}
  for(let i=2;i<H*S;i+=4){const c=cand?(i%8==2?0xe11d48:0xffffff):0x7a5230;box(.5,2.2,.5,mm(c),-.3,1.1,i);box(.5,2.2,.5,mm(c),W*S+.3,1.1,i)}}
 for(const z of slow)box(z[2]*S,.1,z[3]*S,mm(m.pud),(z[0]+z[2]/2)*S,.06,(z[1]+z[3]/2)*S);
 for(const w of walls)item(w);
}

// ---------- Blocky characters ----------
const GC={},bg=(w,h,d)=>GC[w+','+h+','+d]||(GC[w+','+h+','+d]=new THREE.BoxGeometry(w,h,d));
const G={sh:new THREE.SphereGeometry(1.6,12,8),ring:new THREE.RingGeometry(1.05,1.35,28).rotateX(-Math.PI/2)};
const HATC=[0,0xe11d48,0xfacc15,0x6d28d9,0x4a2f1a,0xffe066];
function label(t){const c=document.createElement('canvas');c.width=128;c.height=32;const x=c.getContext('2d');x.font='bold 22px sans-serif';x.textAlign='center';x.lineWidth=4;x.strokeStyle='#000';x.fillStyle='#fff';x.strokeText(t,64,24);x.fillText(t,64,24);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));s.scale.set(3,.75,1);s.position.y=3.4;return s}
function makeChar(e,av,parent){
 const M=c=>new THREE.MeshLambertMaterial({color:c,transparent:true});
 const skin=M(AV.skin[av.skin][0]),shirt=M(AV.shirt[av.shirt][0]),pants=M(AV.pants[av.pants][0]),dark=M(0x111111),mats=[skin,shirt,pants,dark];
 const g=new THREE.Group();
 const part=(geo,mat,x,y,z,oy)=>{const m=new THREE.Mesh(geo,mat);m.position.y=oy||0;m.castShadow=true;const p=new THREE.Group();p.position.set(x,y,z);p.add(m);g.add(p);return p};
 const L=bg(.38,1,.38);
 e.legL=part(L,pants,-.2,1,0,-.5);e.legR=part(L,pants,.2,1,0,-.5);
 part(bg(.8,1,.4),shirt,0,1.5,0);
 e.armL=part(L,shirt,-.6,1.95,0,-.5);e.armR=part(L,shirt,.6,1.95,0,-.5);
 const head=part(bg(.8,.8,.8),skin,0,2.4,0);
 for(const s of[-1,1]){const eye=new THREE.Mesh(bg(.14,.14,.05),dark);eye.position.set(s*.18,.05,.41);head.add(eye)}
 if(av.hat){const hm=M(HATC[av.hat]);mats.push(hm);
  const hb=(w,h,d,x,y,z)=>{const m=new THREE.Mesh(bg(w,h,d),hm);m.position.set(x,y,z);head.add(m)};
  if(av.hat==1){hb(.9,.2,.9,0,.45,0);hb(.9,.06,.4,0,.37,.5)}
  else if(av.hat==2){hb(.85,.25,.85,0,.5,0);for(const a of[-.3,.3])for(const b of[-.3,.3])hb(.15,.2,.15,a,.72,b)}
  else if(av.hat==3){hb(1.2,.08,1.2,0,.42,0);hb(.7,.5,.7,0,.7,0);hb(.35,.5,.35,0,1.1,0)}
  else if(av.hat==5){hb(1,.08,.14,0,1,.45);hb(1,.08,.14,0,1,-.45);hb(.14,.08,1,.45,1,0);hb(.14,.08,1,-.45,1,0)}
  else{hb(.86,.2,.86,0,.45,0);hb(.86,.7,.2,0,.05,-.42)}}
 e.lab=label(e.name);g.add(e.lab);
 e.emC=document.createElement('canvas');e.emC.width=e.emC.height=64;
 e.emS=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(e.emC),transparent:true}));e.emS.scale.set(1.6,1.6,1);e.emS.position.y=4.3;e.emS.visible=false;g.add(e.emS);

function dirFrom(fw,rt,y){const m=Math.hypot(fw,rt),k=m>1?1/m:1,sn=Math.sin(y),cs=Math.cos(y);return[(-sn*fw+cs*rt)*k,(-cs*fw-sn*rt)*k]}

 for(const z of slow)if(e.x>z[0]&&e.x<z[0]+z[2]&&e.y>z[1]&&e.y<z[1]+z[3])s*=.5;
 const a=e.x,b=e.y;let nx=e.x+dx*s*dt;const ny=e.y+dy*s*dt;if(MODE=='bull'&&e.role=='Chaser')nx=Math.max(LINE+e.r,Math.min(W-LINE-e.r,nx)); // bulls cannot enter the safe lines

function steer(e,vx,vy){const m=Math.hypot(vx,vy)||1;vx/=m;vy/=m;

 e.dec=D().rt*(.7+Math.random()*.6);

 let v=null;const gx=MODE=='bull'?(e.side?40:W-40):ZX,gy=MODE=='bull'?e.y:ZY;

  // hunt the closest survivor that other imposters are not already chasing, aim where they are heading
  let best=null,bs=1e9;
  for(const o of foes.concat(props.filter(q=>q.k==2).map(q=>({x:q.x,y:q.y,vx:0,vy:0,ck:0})))){const d=Math.hypot(o.x-e.x,o.y-e.y);if(d>(MODE=='bull'?1e9:D().vis)||(o.ck>0&&d>90))continue; // limited eyesight (decoys count as survivors)
   let sc=d*e.pref;for(const c of ents)if(c!=e&&c.role=='Chaser'&&Math.hypot(o.x-c.x,o.y-c.y)<d)sc+=60;
   if(sc<bs){bs=sc;best=o}}
  if(best){const d=Math.hypot(best.x-e.x,best.y-e.y),lt=Math.min(.6,d/e.spd)*(save.diff=='Easy'?.3:.8);
   v=[best.x+best.vx*lt-e.x,best.y+best.vy*lt-e.y];if(d<230&&Math.random()<D().ab)useAb(e);if(d<110&&Math.random()<D().ab)dash(e)}else if(MODE=='escape')v=[ZX-e.x,ZY-e.y]

function update(dt){
 if(net.mode=='client')return;
 if(state=='head'){headT-=dt;if(headT<=0){state='play';$('cd').style.display='none'}}
 if(state!='play'&&state!='head')return;
 if(state=='play')timer-=dt;
 for(const e of ents){for(const k of['ck','sh','rk','dg','sp','cd','imm','tcd','stun','stuck','ds','dc','emt'])e[k]=Math.max(0,e[k]-dt);
  e.mvd=false;if((state=='head'&&(e.role=='Chaser'||MODE=='bull'))||e.stun>0||e.safe)continue;
  let dx=0,dy=0;
  if(e.human)[dx,dy]=dirFrom(...inputVec(),yaw);
  else if(e.remote){if(e.in)[dx,dy]=dirFrom(e.in.fw,e.in.rt,e.in.yaw)}
  else[dx,dy]=ai(e,dt);
  if(e.ds>0&&Math.hypot(dx,dy)<.1){dx=Math.sin(e.fa);dy=Math.cos(e.fa)}
  if(Math.hypot(dx,dy)>.1){e.mvd=true;e.fa=Math.atan2(dx,dy)}
  if(!move(e,dx,dy,dt)&&!e.human&&!e.remote&&e.stuck<=0){const a=Math.random()*6.28;e.wx=Math.cos(a);e.wy=Math.sin(a);e.stuck=.5}}
 if(MODE=='bull')for(const e of ents)if(e.role=='Chaser')e.x=Math.max(LINE+e.r,Math.min(W-LINE-e.r,e.x)); // bulls can never be inside a safe line (also covers Air Horn pushes)
 if(state!='play')return;
 for(const f of foods){if(!f.a){f.rt-=dt;if(f.rt<=0)f.a=1;continue}
  for(const e of ents)if(Math.hypot(e.x-f.x,e.y-f.y)<34){f.a=0;f.rt=20;if(e==P)toast(FN[f.k]);if(f.k==0)e.sp=5;else if(f.k==1)e.sh=Math.max(e.sh,10);else e.cakes++;break}}
 for(const c of ents){if(c.role!='Chaser'||c.tcd>0)continue;
  for(const r of ents){if(r.role!='Runner'||r.imm>0||(MODE=='bull'&&(r.x<LINE||r.x>W-LINE)))continue;
   if(Math.hypot(c.x-r.x,c.y-r.y)<c.r+r.r+(c.dg>0?36:16)){
    if(r.sh>0){r.sh=0;r.imm=1.2;c.tcd=1}
    else{r.role='Chaser';r.tcd=1.5;r.stun=D().stun;r.ck=r.sh=r.rk=r.dg=r.cd=0;c.tags++;c.tcd=.5;if(r==P)flash=.4}
    break}}}
 if(MODE=='bull')for(const r of ents)if(r.role=='Runner'&&!r.safe&&(r.side?r.x<LINE:r.x>W-LINE)){r.safe=1;r.side=1-r.side;r.ck=r.sh=0;if(r==P)toast('Safe!')}
 if(MODE=='escape')for(const r of ents)if(r.role=='Runner'&&!r.safe&&r.x>ZONE[0]&&r.x<ZONE[0]+ZONE[2]&&r.y>ZONE[1]&&r.y<ZONE[1]+ZONE[3]){r.safe=1;r.imm=999;r.ck=r.sh=0;if(r==P)toast('You made it to the safe zone!')}
 for(const p of props.slice()){p.t-=dt;let kill=p.t<=0;
  if(!kill&&p.k==1)for(const o of ents)if(o.role=='Runner'&&o.imm<=0&&Math.hypot(o.x-p.x,o.y-p.y)<30){o.stun=Math.max(o.stun,2.5);kill=true;if(o==P)toast('Caught in a bear trap!');break}
  if(!kill&&p.k==2)for(const o of ents)if(o.role=='Chaser'&&Math.hypot(o.x-p.x,o.y-p.y)<32){o.stun=Math.max(o.stun,1);kill=true;break}
  if(kill)removeProp(p)}

}

function sync(dt,now){
 yaw+=((keys.ArrowLeft?1:0)-(keys.ArrowRight?1:0))*dt*2.2;pitch=CL(pitch+((keys.ArrowDown?1:0)-(keys.ArrowUp?1:0))*dt*1.5,-.5,1.2);
 const menu=state=='menu';mapG.visible=entG.visible=foodG.visible=propG.visible=!menu;pvG.visible=menu;
 if(menu){scene.background=SKY;scene.fog=null;hemi.intensity=.85;sun.intensity=.85;sun.color.setHex(0xffffff);if(pv)pv.rotation.y+=dt*.8;cam.position.set(-98.2,2.6,-94.6);cam.lookAt(-98.2,1.5,-100);return}
 for(const e of ents){
  if(net.mode=='client'){const k=Math.min(1,dt*14);e.x+=(e.tx-e.x)*k;e.y+=(e.ty-e.y)*k}
  e.g.position.set(e.x*S,0,e.y*S);e.g.rotation.y=e.fa;e.g.visible=!(e==P&&view==0);
  if(e.mvd)e.ph+=dt*(e.rk>0?20:11);
  const sw=e.mvd?Math.sin(e.ph)*.8:0;
  e.armL.rotation.x=sw;e.armR.rotation.x=-sw;e.legL.rotation.x=-sw;e.legR.rotation.x=sw;
  e.ring.material.color.setHex(e.safe?0xffd700:e.role=='Chaser'?0xff2d2d:0x2dff6a); // red = imposter, green = not tagged
  const op=e.ck>0?(e.human?.35:.06):1;
  for(const m of e.mats)m.opacity=op;e.lab.material.opacity=op;
  e.shield.visible=e.sh>0;e.sword.visible=e.dg>0;e.flame.visible=e.rk>0;
  const em=e.emt>0?e.em:0;e.emS.visible=em>0;
  if(e.emShown!==em){e.emShown=em;const x=e.emC.getContext('2d');x.clearRect(0,0,64,64);x.font='44px sans-serif';x.textAlign='center';x.fillText(EMO[em]||'',32,48);e.emS.material.map.needsUpdate=true}
  if(em)e.armR.rotation.x=-2.7+Math.sin(now/110)*.5}
 if(neonMat)neonMat.emissive.setHSL((now/8000)%1,1,.4);
 for(const p of props){if(!p.m){p.m=propMesh(p.k);propG.add(p.m)}p.m.position.set(p.x*S,0,p.y*S);p.m.rotation.y=p.k==0?(Math.abs(Math.sin(p.fa))>Math.abs(Math.cos(p.fa))?Math.PI/2:0):p.fa}
 for(let i=0;i<foods.length;i++){const f=foods[i];f.m.visible=!!f.a;f.m.position.set(f.x*S,.9+Math.sin(now/300+i)*.2,f.y*S);f.m.rotation.y=now/600}
 if(P){const px=P.x*S,pz=P.y*S,fx=-Math.sin(yaw),fz=-Math.cos(yaw),D=(cam.aspect<1?1.5:1)*(view==1?7:9),cp=Math.cos(pitch);
  if(view==0){const a=pitch-.5;cam.position.set(px+fx*.5,2.5,pz+fz*.5);cam.lookAt(px+fx*10*Math.cos(a),2.5-Math.sin(a)*10,pz+fz*10*Math.cos(a))}
  else{const sg=view==1?1:-1;tv.set(px+sg*fx*D*cp,2+D*Math.sin(pitch),pz+sg*fz*D*cp);cam.position.lerp(tv,.25);cam.lookAt(px,1.8,pz)}}
}
function hud(){
 if(!P||state=='menu')return;
 const left=ents.filter(e=>e.role=='Runner'&&!e.safe).length;
 $('hud').style.display=$('cam').style.display=$('sb').style.display=$('dh').style.display='block';
 const t=Math.max(0,Math.ceil(timer));
 $('hud').textContent=map.name+'  |  '+Math.floor(t/60)+':'+('0'+t%60).slice(-2)+'  |  You: '+RN[P.role]+'  |  Survivors left: '+(MODE=='bull'?ents.filter(e=>e.role=='Runner').length:left)+(MODE!='tag'?'  |  Safe: '+ents.filter(e=>e.safe).length:'')+(MODE=='bull'?'  |  Wave '+wave:'  |  Food: '+foods.filter(f=>f.a).length);
 const sb=ents.map(e=>'<div><span style="color:'+(e.role=='Chaser'?'#ff5555':'#55ff77')+'">&#9679;</span> '+e.name+(e==P?' (you)':'')+(e.cakes?' &#127856;'+e.cakes:'')+'</div>').join('');
 if($('sb').dataset.v!=sb){$('sb').dataset.v=sb;$('sb').innerHTML=sb}
 if(state=='head'){$('cd').style.display='block';$('cd').textContent='Imposters released in '+Math.ceil(headT)}
 const a=ABIL[save.eq[P.role]],b=$('ab');
 b.style.display=a?'block':'none';
 if(a){b.disabled=P.cd>0;b.textContent=P.cd>0?a.n+' '+Math.ceil(P.cd)+'s':a.n+' [E]'}
}
cam.position.set(30,25,40);cam.lookAt(30,0,20);
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;flash=Math.max(0,flash-dt);$('fl').style.opacity=flash>0?.35:0;
 update(dt);netTick(dt);sync(dt,now);hud();renderer.render(scene,cam);requestAnimationFrame(loop)}
showMenu('Dodge the Imposters and stay green!');if(!save.seen)showHelp(0);
requestAnimationFrame(loop);
</script>
</body>
